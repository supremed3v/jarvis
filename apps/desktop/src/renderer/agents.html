<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS Agents</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      height: 100vh;
      overflow-y: auto;
    }
    .page {
      max-width: 760px;
      margin: 0 auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }
    h1 {
      font-size: 1.2rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #00d4ff;
    }
    .subtitle { font-size: 0.75rem; color: #777; }
    .error-banner {
      display: none;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(255, 84, 84, 0.12);
      border: 1px solid rgba(255, 84, 84, 0.4);
      color: #ffb4b4;
      font-size: 0.85rem;
      text-align: center;
    }
    .error-banner.visible { display: block; }
    .empty {
      padding: 24px;
      text-align: center;
      color: #999;
      font-size: 0.9rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px dashed rgba(255, 255, 255, 0.12);
      border-radius: 10px;
    }
    .agent {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .agent.disabled { opacity: 0.55; }
    .agent-head {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .agent-id { font-weight: 600; font-size: 0.95rem; }
    .agent-desc { color: #aaa; font-size: 0.8rem; }
    .agent-status {
      margin-left: auto;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: rgba(255, 255, 255, 0.08);
      color: #ccc;
    }
    .agent-status.running { background: rgba(110, 231, 160, 0.16); color: #6ee7a0; }
    .agent-status.ready,
    .agent-status.registered { background: rgba(0, 212, 255, 0.14); color: #00d4ff; }
    .agent-status.initializing,
    .agent-status.stopping { background: rgba(250, 204, 21, 0.14); color: #facc15; }
    .agent-status.stopped { background: rgba(255, 255, 255, 0.08); color: #999; }
    .agent-status.failed { background: rgba(255, 84, 84, 0.16); color: #ffb4b4; }
    .toggle-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
    }
    .toggle-row input {
      width: 18px;
      height: 18px;
      accent-color: #00d4ff;
      cursor: pointer;
    }
    .toggle-row input:disabled { cursor: default; }
    details { font-size: 0.8rem; }
    details summary {
      cursor: pointer;
      color: #00d4ff;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .config { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }
    .config h3 {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #777;
    }
    .chip-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 0.72rem;
      color: #ccc;
    }
    .config .none { color: #777; }
  </style>
</head>
<body>
  <div class="page" id="page">
    <header>
      <h1>JARVIS Agents</h1>
      <span class="subtitle" id="subtitle"></span>
    </header>

    <p class="error-banner" id="error"></p>

    <div id="list"></div>
  </div>
  <script src="agentsRenderer.js"></script>
</body>
</html>
