<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      user-select: none;
      -webkit-app-region: drag;
    }
    .container { text-align: center; }
    h1 { font-size: 2.5rem; letter-spacing: 0.3em; margin-bottom: 0.5rem; color: #00d4ff; }
    .status { font-size: 0.9rem; color: #888; }
    .version { font-size: 0.75rem; color: #555; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>JARVIS</h1>
    <p class="status" id="status">Initializing...</p>
    <p class="status" id="voice-event"></p>
    <p class="version" id="version"></p>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
