<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }
    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 24px;
      gap: 20px;
    }
    .orb-wrap { position: relative; width: 160px; height: 160px; }
    .orb {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #2b2b55, #14142a);
      box-shadow: 0 0 24px rgba(0, 212, 255, 0.15);
      transition: box-shadow 0.4s ease, background 0.4s ease;
    }
    .orb::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      box-shadow: 0 0 0 rgba(0, 212, 255, 0);
      transition: box-shadow 0.4s ease;
    }
    .orb.idle {
      background: radial-gradient(circle at 35% 30%, #2b2b55, #14142a);
      box-shadow: 0 0 24px rgba(0, 212, 255, 0.1);
    }
    .orb.listening {
      background: radial-gradient(circle at 35% 30%, #1f6f8b, #0f3a4a);
      box-shadow: 0 0 40px rgba(0, 212, 255, 0.6);
      animation: pulse 1.6s ease-in-out infinite;
    }
    .orb.thinking {
      background: radial-gradient(circle at 35% 30%, #5a4a9a, #2a1f4a);
      box-shadow: 0 0 40px rgba(148, 108, 255, 0.5);
      animation: breathe 2.4s ease-in-out infinite;
    }
    .orb.speaking {
      background: radial-gradient(circle at 35% 30%, #1f8b5f, #0f4a32);
      box-shadow: 0 0 44px rgba(52, 231, 158, 0.6);
      animation: pulse 1.1s ease-in-out infinite;
    }
    .orb.error {
      background: radial-gradient(circle at 35% 30%, #8b2f2f, #4a1010);
      box-shadow: 0 0 44px rgba(255, 84, 84, 0.6);
      animation: pulse 0.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    @keyframes breathe {
      0%, 100% { transform: scale(0.94); }
      50% { transform: scale(1.04); }
    }
    .status-label {
      font-size: 1.4rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #00d4ff;
    }
    .status-label.error-label { color: #ff5454; }
    .error-banner {
      display: none;
      max-width: 480px;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(255, 84, 84, 0.12);
      border: 1px solid rgba(255, 84, 84, 0.4);
      color: #ffb4b4;
      font-size: 0.85rem;
      text-align: center;
    }
    .error-banner.visible { display: block; }
    .runtime-status { font-size: 0.8rem; color: #888; }
    .version { font-size: 0.7rem; color: #555; }
    .sessions {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
      max-height: 32vh;
      padding: 4px;
    }
    .sessions.empty { display: none; }
    .sessions h2 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: #777;
      margin-bottom: 2px;
    }
    .session-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.85rem;
    }
    .session-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #555;
      flex-shrink: 0;
    }
    .session-dot.active { background: #00d4ff; box-shadow: 0 0 8px rgba(0, 212, 255, 0.8); }
    .session-dot.ended { background: #3a3a55; }
    .session-id { color: #aaa; font-family: ui-monospace, monospace; font-size: 0.75rem; }
    .session-meta { flex: 1; color: #ccc; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .session-state { color: #888; font-size: 0.7rem; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="orb-wrap">
      <div class="orb idle" id="orb"></div>
    </div>
    <p class="status-label" id="state">IDLE</p>
    <p class="error-banner" id="error"></p>
    <p class="runtime-status" id="status">Initializing...</p>
    <p class="version" id="version"></p>
    <div class="sessions empty" id="sessions">
      <h2>Voice Sessions</h2>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
